  <canvas id="globeCanvas" aria-hidden="true"></canvas>
  <div class="gb__hud">
    <div class="gb__top">
      <p class="gb__year" id="gbYear">&minus;1999<small id="gbYearLab">Year</small></p>
      <button class="gb__skip" id="gbSkip" type="button">Skip</button>

    <div class="gb__bottom">
      <p class="gb__count" id="gbCount"></p>
      <p class="gb__caption" id="gbCaption"></p>
      <p class="gb__note" id="gbNote"></p>
    </div>
  </div>
</section>
